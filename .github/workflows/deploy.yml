name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # One-time repository setup: Settings -> Pages -> Source -> GitHub
      # Actions. Until that is set, this step fails with "Get Pages site
      # failed ... Not Found" and nothing below it runs.
      #
      # `enablement: true` is not the way round it. GITHUB_TOKEN is allowed to
      # read the Pages site but not to create one — it comes back "Resource
      # not accessible by integration" — so the flag turns a clear error into
      # a confusing one and still does not deploy.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
