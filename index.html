<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meshlight — offline STL, OBJ, PLY and 3MF mesh inspector</title>
    <meta
      name="description"
      content="Check STL, OBJ, PLY and 3MF meshes for holes, non-manifold edges and flipped normals, score how well they will print, and repair them — free, in your browser, nothing uploaded."
    />
    <link rel="canonical" href="https://meshlight.org/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#07090D" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Absolute URLs on purpose: `base` is '' so the app itself runs from any
         path, but a crawler resolving a share card has no page context to
         resolve a relative one against. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meshlight" />
    <meta property="og:url" content="https://meshlight.org/" />
    <meta property="og:title" content="Meshlight — offline STL, OBJ, PLY and 3MF mesh inspector" />
    <meta
      property="og:description"
      content="Check a mesh for the things that ruin a print — holes, non-manifold edges, flipped normals, loose shells — score how well it will print, and repair it. Free, in your browser, nothing uploaded."
    />
    <meta property="og:image" content="https://meshlight.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meshlight — check a mesh for the things that ruin a print, before you print it. Reads STL, OBJ, PLY and 3MF." />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meshlight — offline STL, OBJ, PLY and 3MF mesh inspector" />
    <meta
      name="twitter:description"
      content="Check a mesh for the things that ruin a print, score how well it will print, and repair it. Free, in your browser, nothing uploaded."
    />
    <meta name="twitter:image" content="https://meshlight.org/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Meshlight",
        "url": "https://meshlight.org/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any modern web browser",
        "browserRequirements": "Requires JavaScript and WebGL",
        "description": "A browser-based mesh inspector for 3D printing. Reads STL, OBJ, PLY and 3MF, checks for holes, non-manifold edges, flipped normals and loose shells, scores printability, repairs the mesh and exports STL. Runs entirely client-side with no upload.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",
        "image": "https://meshlight.org/og.png",
        "featureList": [
          "Watertightness and non-manifold edge detection",
          "Normal consistency and inverted shell detection",
          "Printability score with per-check breakdown",
          "3D printing readiness checks",
          "Mesh repair with before and after preview",
          "Cross-section cutaway viewer",
          "Works offline after the first visit"
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      Meshlight analyses mesh files in your browser, so it needs JavaScript enabled. Nothing is
      uploaded either way.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
